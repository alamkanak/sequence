<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <link
      rel="icon"
      type="image/x-icon"
      sizes="16x16 32x32 48x48"
      href="/favicon.ico"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      property="og:title"
      content="Sequence — Your browser. Your video studio."
    />
    <meta
      name="twitter:title"
      content="Sequence — Your browser. Your video studio."
    />
    <meta property="og:image:width" content="1200" />
    <meta
      property="og:image:alt"
      content="Sequence — Free video editing in your browser. Edit by hand or with your AI agent. No installation, account, watermark, or uploads."
    />
    <meta
      name="twitter:image"
      content="https://alamkanak.github.io/sequence/brand/social-card.png"
    />
    <script>
      try {
        const t = localStorage.getItem("sequence-theme") || "system";
        document.documentElement.dataset.theme =
          t === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t;
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <noscript
      ><p>
        Interactive editing requires JavaScript. The public product information
        is available below.
      </p></noscript
    >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
